name: Job Monitor

on:
  schedule:
    - cron: '0,30 3-16 * * *'
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium

      - name: Create config
        run: |
          sed -e "s|GITHUB_GMAIL_ADDRESS|${{ secrets.GMAIL_ADDRESS }}|g" \
              -e "s|GITHUB_GMAIL_APP_PASSWORD|${{ secrets.GMAIL_APP_PASSWORD }}|g" \
              config.yaml.template > config.yaml
          echo "Email configured as: $(grep 'username:' config.yaml)"

      - name: Download previous state
        uses: dawidd6/action-download-artifact@v6
        with:
          name: jobs-db
          path: .
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Run monitor
        run: python monitor.py

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db
          path: jobs.db
          retention-days: 90
          overwrite: true